backend:
  name: git-gateway
  branch: master

media_folder: public/uploads
public_folder: /uploads

locale: es

collections:
  - name: articulos
    label: Artículos
    folder: src/content/articulos
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: title, widget: string }
      - { label: "Descripción", name: description, widget: text }
      - { label: "Fecha de publicación", name: date, widget: datetime, format: "YYYY-MM-DD" }
      - label: "Categoría"
        name: category
        widget: select
        options:
          - Biología
          - Física
          - Química
          - Tecnología
          - Medio Ambiente
      - { label: "Imagen de portada", name: coverImage, widget: image }
      - { label: "Autor", name: author, widget: string }
      - { label: "Contenido", name: body, widget: markdown }

  - name: equipo
    label: Equipo
    folder: src/content/equipo
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: "Nombre", name: name, widget: string }
      - { label: "Rol", name: role, widget: string }
      - { label: "Biografía", name: bio, widget: text }
      - { label: "Foto", name: photo, widget: image }
      - { label: "Orden", name: order, widget: number, value_type: int, required: false }
      - label: "Redes sociales"
        name: socialLinks
        widget: object
        required: false
        fields:
          - { label: "Instagram", name: instagram, widget: string, required: false }
          - { label: "Twitter / X", name: twitter, widget: string, required: false }
          - { label: "LinkedIn", name: linkedin, widget: string, required: false }

  - name: legal
    label: Páginas legales
    files:
      - name: privacidad
        label: Política de privacidad
        file: src/content/legal/privacidad.md
        fields:
          - { label: "Título", name: title, widget: string, default: "Política de privacidad" }
          - { label: "Última actualización", name: lastUpdated, widget: datetime, format: "YYYY-MM-DD" }
          - { label: "Contenido", name: body, widget: markdown }
      - name: terminos
        label: Términos de servicio
        file: src/content/legal/terminos.md
        fields:
          - { label: "Título", name: title, widget: string, default: "Términos de servicio" }
          - { label: "Última actualización", name: lastUpdated, widget: datetime, format: "YYYY-MM-DD" }
          - { label: "Contenido", name: body, widget: markdown }

  - name: settings
    label: Configuración
    files:
      - name: theme
        label: Tema y apariencia
        file: src/data/settings.json
        fields:
          - { label: "Nombre del sitio", name: siteName, widget: string, default: "Ciensite" }
          - { label: "Logo personalizado", name: logo, widget: image, required: false, hint: "Sube tu logo. Si no se proporciona, se usa el logo por defecto." }
          - { label: "Imagen para redes sociales", name: ogImage, widget: image, required: false, hint: "Imagen que aparece al compartir en redes sociales. Recomendado: 1200x630px." }
          - label: "Colores"
            name: colors
            widget: object
            fields:
              - { label: "Color primario", name: primary, widget: color, default: "#00C2A8", allowInput: true }
              - { label: "Color primario oscuro (hover)", name: primaryDark, widget: color, default: "#00A38D", allowInput: true }
              - { label: "Fondo modo oscuro", name: darkBg, widget: color, default: "#0A1628", allowInput: true }
              - { label: "Fondo modo oscuro (claro)", name: darkBgLight, widget: color, default: "#122240", allowInput: true }
              - { label: "Fondo modo claro", name: lightBg, widget: color, default: "#F8F7F4", allowInput: true }
          - label: "Redes sociales"
            name: social
            widget: object
            required: false
            fields:
              - { label: "Instagram", name: instagram, widget: string, required: false, hint: "URL completa, ej: https://instagram.com/tu_cuenta" }
              - { label: "YouTube", name: youtube, widget: string, required: false, hint: "URL completa, ej: https://youtube.com/@tu_canal" }
              - { label: "TikTok", name: tiktok, widget: string, required: false, hint: "URL completa, ej: https://tiktok.com/@tu_cuenta" }
          - label: "Banner de cookies"
            name: cookieBanner
            widget: object
            required: false
            fields:
              - { label: "Activado", name: enabled, widget: boolean, default: true }
              - { label: "Título", name: title, widget: string, default: "Cookies" }
              - { label: "Mensaje", name: body, widget: text }
              - { label: "Botón aceptar", name: acceptLabel, widget: string, default: "Aceptar" }
              - { label: "Botón rechazar", name: rejectLabel, widget: string, default: "Rechazar" }
              - { label: "Texto enlace privacidad", name: privacyLinkLabel, widget: string, default: "Política de privacidad" }
          - label: "Newsletter"
            name: newsletter
            widget: object
            required: false
            fields:
              - { label: "Activado", name: enabled, widget: boolean, default: false, hint: "Actívalo solo cuando tengas una cuenta en Mailchimp / Buttondown / etc." }
              - { label: "URL del formulario (action)", name: actionUrl, widget: string, required: false, hint: "URL a la que se envía el email. Ej: https://example.us12.list-manage.com/subscribe/post?u=XXX&id=YYY" }
              - { label: "Título", name: title, widget: string, default: "Suscríbete" }
              - { label: "Subtítulo", name: subtitle, widget: text }
              - { label: "Placeholder del campo correo", name: emailPlaceholder, widget: string, default: "tu@correo.com" }
              - { label: "Texto del botón", name: submitLabel, widget: string, default: "Suscribirme" }
              - { label: "Mensaje de éxito", name: successMessage, widget: string, default: "¡Gracias por suscribirte!" }

      - name: multimedia
        label: Multimedia
        file: src/data/multimedia.json
        fields:
          - label: "Videos de YouTube"
            name: videos
            widget: list
            required: false
            fields:
              - { label: "ID del video", name: id, widget: string, hint: "El ID aparece en la URL después de 'v='. Ej: dQw4w9WgXcQ" }
              - { label: "Título", name: title, widget: string }
          - label: "Galería de fotos"
            name: gallery
            widget: list
            required: false
            fields:
              - { label: "Foto", name: src, widget: image }
              - { label: "Descripción", name: alt, widget: string }
          - label: "Posts de Instagram"
            name: instagramPosts
            widget: list
            required: false
            fields:
              - { label: "URL del post", name: url, widget: string, hint: "URL completa, ej: https://www.instagram.com/p/ABC123/" }
